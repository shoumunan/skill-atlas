<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Skill Atlas 自绘原创「带翼信使杖」glyph（非 Hermes 官方标）。
       官方标是插画风人物头像，18pt 下糊成一团，也进不了这排几何标的体系；
       与 openclaw.svg 同一处置：抽象化重画，纯 stroke 路径，模板模式上色。
       翅膀不收口——收口就读成叶子，整个标会变成一株小树苗。 -->
  <g fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 8.6 L12 20.2"/>
    <path d="M11.2 10.4 C8.2 10.2, 5.4 8.6, 3.4 5.8"/>
    <path d="M12.8 10.4 C15.8 10.2, 18.6 8.6, 20.6 5.8"/>
    <path d="M11.4 14.6 C9.4 14.4, 7.6 13.4, 6.3 11.7"/>
    <path d="M12.6 14.6 C14.6 14.4, 16.4 13.4, 17.7 11.7"/>
  </g>
  <circle cx="12" cy="5.6" r="2.1" fill="#000000"/>
</svg>
